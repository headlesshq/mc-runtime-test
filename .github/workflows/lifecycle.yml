---
name: Lifecycle

"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      mc:
        description: Comma-delimited Minecraft versions to run (i.e. 1.20.4,26.1.2 )
        default: "all"
      ref:
        description: Git ref to checkout before running (i.e. my-feature-branch )
        default: "main"

concurrency: # FIXME: prevent release commit cancellation
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - if: github.event_name == 'push' # TODO: explicit on push to main
        id: release-please
        name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  matrices:
    if: github.event.action != 'closed'
    name: Construct matrices
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      run-matrix: ${{ steps.matrices.outputs.run-matrix }}
    steps:
      - name: Get ci-data.json from mc-runtime-test-mod
        run: curl -fsSL -o ci-data.json https://raw.githubusercontent.com/headlesshq/mc-runtime-test-mod/main/ci-data.json
        shell: bash

      - id: matrices
        name: Construct matrices
        run: |
          import os
          import json
          import copy

          run_matrix = {"version": []}

          with open('ci-data.json') as f:
              run_data = json.load(f)['run_data']

          match os.getenv('GITHUB_EVENT_NAME'):
            case 'pull_request':
              if '${{ github.head_ref }}'.startswith('release-please--'):
                # Run all versions before releasing
                run_matrix['version'] = run_data
              else:
                # Otherwise only run the latest version (3 modloaders)
                run_matrix['version'] = run_data[:3]

            case 'workflow_dispatch':
              input_mc = '${{ github.event.inputs.mc }}'
              if input_mc == 'all':
                run_matrix['version'] = run_data
              else:
                mc_versions = [item.strip() for item in input_mc.split(',')]
                run_matrix['version'] = [item for item in run_data if item['mc'] in mc_versions]

          for entry in run_matrix['version']:
            entry['runner'] = 'ubuntu-latest' #'blacksmith-2vcpu-ubuntu-2204'
            entry['cache'] = 'github' #'blacksmith'
            entry['xvfb'] = True

          additional_runs = []
          for item in run_matrix['version']:
            #runners = [ ('blacksmith-2vcpu-ubuntu-2204', 'blacksmith') ] # also add non-xvfb runs for ubuntu
            runners = [ ('ubuntu-latest', 'github') ] # also add non-xvfb runs for ubuntu
            if len(additional_runs) < 9: # add other runners only for the latest version * 3 modloaders * 3 runners
              runners += [ ('windows-latest', 'github'), ('macos-latest', 'github') ]
            for runner, cache in runners:
              entry = copy.deepcopy(item)
              entry['runner'] = runner
              entry['cache'] = cache
              entry['xvfb'] = False
              additional_runs.append(entry)

          run_matrix['version'] += additional_runs

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            print(json.dumps(run_matrix, indent=2))
            fh.write(f'run-matrix={json.dumps(run_matrix)}\n')
        shell: python {0}

  run:
    if: github.event_name != 'push' && fromJSON(needs.matrices.outputs.run-matrix).version[0] != null
    name: Run tests
    needs: matrices
    runs-on: ${{ matrix.version.runner }}
    strategy:
      fail-fast: false
      matrix:
        ${{ insert }}: ${{ fromJSON(needs.matrices.outputs.run-matrix) }}
    steps:
      - name: Checkout # TODO: simplify away this step, currently needed for `uses: ./`
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Github Java temurin-${{ matrix.version.java }}
        if: matrix.version.cache == 'github'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.version.java }}
          distribution: temurin

      - name: Setup Blacksmith Java temurin-${{ matrix.version.java }}
        if: matrix.version.cache == 'blacksmith'
        uses: useblacksmith/setup-java@4ef812391eff6e9737ba13bf0356d0f702877a64 # v5
        with:
          java-version: ${{ matrix.version.java }}
          distribution: temurin

      - name: Run game
        timeout-minutes: 3
        uses: ./
        with:
          cache-mc: ${{ matrix.version.cache }}
          mc: ${{ matrix.version.mc }}
          mc-runtime-test: ${{ matrix.version.type }}
          modloader: ${{ matrix.version.modloader }}
          java: ${{ matrix.version.java }}
          xvfb: ${{ matrix.version.xvfb }}
          headlessmc-command: --retries 3 --jvm -Djava.awt.headless=true
